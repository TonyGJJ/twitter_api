<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TwtAPI Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 880px;
      margin: 32px auto;
      padding: 0 16px;
      line-height: 1.5;
    }
    input, button {
      font-size: 16px;
      padding: 8px 12px;
    }
    pre {
      background: #f4f4f5;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>TwtAPI Flask Demo</h1>
  <p>这个页面会调用后端接口 <code>/api/trends</code>，后端再请求 TwtAPI。</p>

  <label for="woeid">WOEID:</label>
  <input id="woeid" type="number" value="1">
  <button id="runBtn" type="button">查询 Trends</button>

  <h2>返回结果</h2>
  <pre id="output">点击“查询 Trends”开始</pre>

  <script>
    const runBtn = document.getElementById("runBtn");
    const woeidInput = document.getElementById("woeid");
    const output = document.getElementById("output");

    async function runQuery() {
      const woeid = woeidInput.value || "1";
      output.textContent = "请求中...";
      try {
        const resp = await fetch(`/api/trends?woeid=${encodeURIComponent(woeid)}`);
        const data = await resp.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = `请求失败: ${err}`;
      }
    }

    runBtn.addEventListener("click", runQuery);
  </script>
</body>
</html>
